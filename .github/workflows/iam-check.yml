name: Terraform IAM Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check-iam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install checkov
      - run: checkov -f main.tf --framework terraform --check CKV_AWS_355
